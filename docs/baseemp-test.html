<!doctype html><meta charset="utf-8"><title>Teste Base Empresarial</title><pre id="o">iniciando...</pre>
<script>
(async()=>{
 const o=document.getElementById('o');
 try{
  const r1=await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/SP/municipios');
  const cities=await r1.json(); const hit=cities.find(x=>x.nome==='São José do Rio Preto');
  o.textContent='IBGE status '+r1.status+' code='+(hit&&hit.id)+'\n';
  const p=new URLSearchParams();
  p.set('filter[city_ibge_code]',String(hit.id));
  p.set('filter[uf_abbreviation]','SP');
  p.set('filter[registration_status]','02');
  p.set('filter[cnae_code]','9602501');
  p.set('per_page','100');
  p.set('page','1');
  p.set('include','city,state');
  const url='https://app.baseempresarial.com.br/api/v1/establishments?'+p.toString();
  const r2=await fetch(url,{headers:{Accept:'application/json'}});
  const txt=await r2.text(); o.textContent+='Base status '+r2.status+'\n'+txt.slice(0,10000);
 }catch(e){o.textContent+='ERRO '+e}
})();
</script>
