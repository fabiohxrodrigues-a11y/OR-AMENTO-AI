<!doctype html><meta charset="utf-8"><pre id="o">iniciando...</pre><script>
(async()=>{
const ids=['47942224000186','62651289000166','53876949000116'],o=document.getElementById('o'),out=[];
for(const c of ids){
 try{
  const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+c,{headers:{Accept:'application/json'}});
  const j=await r.json();out.push({cnpj:c,status:r.status,nome:j.nome_fantasia||j.razao_social,fone:j.ddd_telefone_1,email:j.email});
 }catch(e){out.push({cnpj:c,erro:String(e)})}
 o.textContent=JSON.stringify(out,null,2);
 await new Promise(r=>setTimeout(r,800));
}
})();</script>
