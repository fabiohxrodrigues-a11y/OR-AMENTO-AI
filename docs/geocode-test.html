<!doctype html><meta charset="utf-8"><title>Teste Geocode</title>
<body style="font-family:Arial;padding:24px"><h2>Teste geocodificação</h2><pre id="o">iniciando...</pre>
<script>
(async()=>{
 const o=document.getElementById('o');
 try{
  const u=new URL('https://nominatim.openstreetmap.org/search');
  u.searchParams.set('format','json');u.searchParams.set('limit','1');u.searchParams.set('countrycodes','br');u.searchParams.set('q','São José do Rio Preto, SP, Brasil');
  const r=await fetch(u.toString(),{headers:{'Accept-Language':'pt-BR'}});
  const t=await r.text();
  o.textContent='status '+r.status+'\n'+t.slice(0,1000);
 }catch(e){o.textContent='erro '+e}
})();
</script>
