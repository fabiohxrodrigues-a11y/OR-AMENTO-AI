<!doctype html><meta charset="utf-8"><title>Teste cobertura</title><pre id="o">iniciando...</pre>
<script>
const o=document.getElementById('o');
(async()=>{
 const logs=[]; const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 try{
  const city=3549805;
  const urls=[
   'https://app.baseempresarial.com.br/api/v1/companies/search?cnae=9602501&city_id='+city+'&registration_status=02&per_page=100&page=1',
   'https://app.baseempresarial.com.br/api/v1/companies/search?cnae=9602501&city_id='+city+'&registration_status=02&per_page=100&page=2',
   'https://app.baseempresarial.com.br/api/v1/companies/search?cnae=9602502&city_id='+city+'&registration_status=02&per_page=100&page=1'
  ];
  const rs=await Promise.all(urls.map(u=>fetch(u).then(r=>r.json())));
  const m=new Map();
  for(const d of rs)for(const x of d.data||[])m.set(x.full_cnpj||x.id,x);
  const all=[...m.values()];
  logs.push('empresas_unicas='+all.length);
  const manic=all.filter(x=>/(manicure|pedicure|nail|unha|esmalteria)/.test(norm((x.trade_name||'')+' '+(x.corporate_name||''))));
  logs.push('manicure_nome_explicito='+manic.length);
  const ordered=[...manic,...all.filter(x=>!manic.includes(x))].slice(0,30);
  let phones=0,emails=0,done=0;
  for(let i=0;i<ordered.length;i+=5){
    await Promise.all(ordered.slice(i,i+5).map(async x=>{try{const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+x.full_cnpj);if(!r.ok)return;const d=await r.json();if(d.ddd_telefone_1||d.ddd_telefone_2)phones++;if(d.email)emails++;}catch{}}));
    done+=Math.min(5,ordered.length-i); o.textContent=logs.concat(['enriquecidos='+done,'com_telefone='+phones,'com_email='+emails]).join('\n');
  }
  logs.push('enriquecidos='+done);logs.push('com_telefone='+phones);logs.push('com_email='+emails);o.textContent=logs.join('\n');
 }catch(e){o.textContent='ERRO '+e}
})();
</script>
