const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function digits(v){return String(v||'').replace(/\D/g,'')}

function showBootError(msg){
  const loading=document.getElementById('loading');
  if(loading){
    loading.classList.remove('hidden');
    loading.innerHTML='<div><h1>Prospecta <span>Beauty</span></h1><p style="margin-top:14px;color:#991b1b">Falha ao iniciar o aplicativo.</p><p class="small" style="max-width:520px;margin-top:8px">'+esc(msg||'Erro desconhecido')+'</p><button class="btn" style="margin-top:14px" onclick="location.reload()">Tentar novamente</button></div>';
  }
}
function loadScript(src,timeoutMs=12000){
  return new Promise((resolve,reject)=>{
    const sc=document.createElement('script');let done=false;
    const tm=setTimeout(()=>{if(done)return;done=true;sc.remove();reject(new Error('Tempo esgotado ao carregar '+src))},timeoutMs);
    sc.src=src;sc.async=true;
    sc.onload=()=>{if(done)return;done=true;clearTimeout(tm);resolve()};
    sc.onerror=()=>{if(done)return;done=true;clearTimeout(tm);sc.remove();reject(new Error('Falha ao carregar '+src))};
    document.head.appendChild(sc);
  });
}
async function loadSupabaseLib(){
  if(window.supabase&&window.supabase.createClient)return;
  const urls=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js'
  ];
  let last=null;
  for(const u of urls){
    try{
      await loadScript(u);
      if(window.supabase&&window.supabase.createClient)return;
      last=new Error('Biblioteca carregou, mas createClient não ficou disponível.');
    }catch(e){last=e}
  }
  throw last||new Error('Não foi possível carregar a biblioteca do Supabase.');
}
async function boot(){
  try{
    await loadSupabaseLib();
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    await init();
  }catch(e){
    console.error('Prospecta Beauty boot error',e);
    showBootError(e&&e.message?e.message:String(e));
  }
}
window.addEventListener('error',e=>console.error('Window error',e.error||e.message));

}

async function login(signup=false){
 const email=$('#authEmail').value.trim(),password=$('#authPassword').value;

 const res=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(res.error){$('#authMsg').textContent=res.error.message;return}
 if(signup&&!res.data.session) $('#authMsg').textContent='Conta criada. Confira seu e-mail para confirmar e depois entre.';
 else $('#authMsg').textContent='Entrando...';
}

async function loadData(){
 const [a,b,c,d,e]=await Promise.all([
  sb.from('leads').select('*').order('created_at',{ascending:false}),
  sb.from('activities').select('*').order('created_at',{ascending:false}).limit(100),
  sb.from('message_templates').select('*'),
  sb.from('products').select('*'),
  sb.from('profiles').select('*').eq('user_id',user.id).maybeSingle()
 ]);
 [a,b,c,d,e].forEach(x=>{if(x.error)console.warn(x.error)});
 leads=a.data||[];activities=b.data||[];templates=Object.fromEntries((c.data||[]).map(x=>[x.niche,x.body]));products=d.data||[];settings=e.data||settings;
}

function render(){renderNav();const meta={dashboard:['Dashboard','Visão geral da sua prospecção'],buscar:['Buscar leads','Encontre negócios em dados públicos'],leads:['Leads','Organize e acompanhe seus contatos'],funil:['Funil','Arraste os leads entre as etapas'],hoje:['Follow-ups de hoje','Veja contatos vencidos e do dia'],mensagens:['Mensagens','Edite os textos usados por nicho'],produtos:['Produtos / Apps','Configure os links de demonstração'],config:['Configurações','Dados do vendedor e manutenção']};$('#pageTitle').textContent=meta[current][0];$('#pageSub').textContent=meta[current][1];const v=$('#view');v.innerHTML=current==='dashboard'?viewDashboard():current==='buscar'?viewSearch():current==='leads'?viewLeads():current==='funil'?viewFunnel():current==='hoje'?viewToday():current==='mensagens'?viewMessages():current==='produtos'?viewProducts():viewSettings();if(current==='leads')setTimeout(refreshLeadTable);if(current==='funil')setTimeout(bindKanban)}

"list">${follow.map(l=>`<div class="row"><div><b>${esc(l.name)}</b><div class="small muted">${new Date(l.next_followup_at).toLocaleString('pt-BR')}</div></div><button class="btn" onclick="pb.wa('${l.id}')">WhatsApp</button></div>`).join('')}</div>`:'<div class="empty">Nenhum follow-up agendado.</div>'}</div></div>`}

function normalizeText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function confidenceRank(v){return v==='Alta'?3:v==='Média'?2:1}




function formatPhoneBR(v){
  const d=digits(v);
  if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  return v||'';
}
function renderSearchResults(){
  let arr=searchResults.map((r,idx)=>({r,idx})).filter(x=>x.r.phone||x.r.whatsapp);
  arr.sort((a,b)=>confidenceRank(b.r.segment_confidence)-confidenceRank(a.r.segment_confidence)||String(a.r.name).localeCompare(String(b.r.name),'pt-BR'));
  if(!arr.length)return '<div class="empty">Nenhum contato com telefone público encontrado nesta busca.</div>';
  const top='<div class="actions" style="margin-bottom:12px"><button class="btn" onclick="pb.addAllSearch()">Adicionar todos aos leads</button><span class="small muted">'+arr.length+' contatos com telefone</span></div>';
  return top+arr.map(x=>{
    const r=x.r,idx=x.idx,phone=r.whatsapp||r.phone,conf=r.segment_confidence||'CNAE';
    const confClass=(conf==='Alta')?'green':(conf==='Média'?'amber':'');
    const contact=(r.address?esc(r.address):'')+(r.cnpj?'<br>CNPJ: '+esc(r.cnpj):'')+'<br><b style="font-size:15px">☎ '+esc(formatPhoneBR(phone))+'</b>'+(r.email?'<br>✉ '+esc(r.email):'');

  }).join('');
}
function osmTagsToLead(el,requestedNiche,city,stateCode){
  const t=el.tags||{},name=(t.name||t.brand||'').trim();if(!name)return null;
  const phone=String(t['contact:phone']||t.phone||t['contact:mobile']||'').trim();
  const whatsapp=String(t['contact:whatsapp']||'').trim();

  const instagram=String(t['contact:instagram']||t.instagram||'').trim();
  const address=[t['addr:street'],t['addr:housenumber'],t['addr:suburb']||t['addr:neighbourhood']].filter(Boolean).join(', ');
  const hair=String(t.hairdresser||'').toLowerCase(),beauty=String(t.beauty||'').toLowerCase(),low=name.toLowerCase();
  let niche=requestedNiche;
  if(t.shop==='hairdresser')niche=(hair.includes('barber')||/barbearia|barber/.test(low))?'Barbearia':'Cabeleireiro';
  else if(t.shop==='beauty')niche=(/(nail|unha|manicure|esmalteria)/.test(low)||/(nails|manicure|pedicure)/.test(beauty))?'Manicure / Nail Designer':'Salão Completo';
  return {name,phone,whatsapp,website,instagram,address,city:t['addr:city']||city,state:t['addr:state']||stateCode,niche,latitude:el.lat??el.center?.lat??null,longitude:el.lon??el.center?.lon??null,source:'OpenStreetMap',segment_confidence:'Alta'};
}
function segmentMatches(el,niche){
  const t=el.tags||{},name=String(t.name||t.brand||'').toLowerCase(),hair=String(t.hairdresser||'').toLowerCase(),beauty=String(t.beauty||'').toLowerCase();
  if(niche==='Manicure / Nail Designer')return /(nail|unha|manicure|esmalteria)/.test(name)||/(nails|manicure|pedicure)/.test(beauty);
  if(niche==='Barbearia')return hair.includes('barber')||/barbearia|barber/.test(name);
  if(niche==='Cabeleireiro')return t.shop==='hairdresser'&&!hair.includes('barber')&&!/barbearia|barber/.test(name);
  return t.shop==='beauty'||t.shop==='hairdresser';
}
async function fetchTimeout(url,opts={},ms=15000){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
  try{return await fetch(url,{...opts,signal:ctl.signal})}finally{clearTimeout(tm)}
}
async function browserGeocode(city,stateCode){
  const u=new URL('https://nominatim.openstreetmap.org/search');
  u.searchParams.set('format','json');u.searchParams.set('limit','1');u.searchParams.set('countrycodes','br');u.searchParams.set('q',city+', '+stateCode+', Brasil');
  const r=await fetchTimeout(u.toString(),{headers:{'Accept-Language':'pt-BR','Accept':'application/json'}},10000);
  if(!r.ok)throw new Error('Não consegui localizar a cidade.');
  const a=await r.json();if(!Array.isArray(a)||!a[0])throw new Error('Cidade não encontrada.');
  const lat=Number(a[0].lat),lon=Number(a[0].lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))throw new Error('Coordenadas inválidas.');
  return {lat,lon};
}
function makeBrowserQuery(niche,radius,lat,lon){
  const around='(around:'+radius+','+lat+','+lon+')';
  if(niche==='Manicure / Nail Designer')return '[out:json][timeout:15];nwr["shop"="beauty"]'+around+';out center tags 150;';
  if(niche==='Barbearia'||niche==='Cabeleireiro')return '[out:json][timeout:15];nwr["shop"="hairdresser"]'+around+';out center tags 180;';
  return '[out:json][timeout:15];(nwr["shop"="beauty"]'+around+';nwr["shop"="hairdresser"]'+around+';);out center tags 220;';
}
async function browserOverpass(query){
  const eps=['https://overpass-api.de/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.private.coffee/api/interpreter'];
  let last='';
  for(const ep of eps){
    try{
      const r=await fetchTimeout(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','Accept':'application/json'},body:'data='+encodeURIComponent(query)},16000);
      if(!r.ok){last='HTTP '+r.status;continue}
      const d=await r.json();if(Array.isArray(d&&d.elements))return d.elements;
    }catch(e){last=e&&e.name==='AbortError'?'tempo esgotado':String((e&&e.message)||e)}
  }
  throw new Error(last||'Nenhuma fonte pública respondeu.');
}
async function browserBusinessSearch(city,stateCode,niche,radius){

async function resolveCityIbge(city,stateCode){
  const r=await fetchTimeout('https://brasilapi.com.br/api/ibge/municipios/v1/'+encodeURIComponent(stateCode),{headers:{Accept:'application/json'}},12000);
  if(!r.ok)throw new Error('Falha ao consultar municípios.');
  const list=await r.json(),target=normalizeText(city);
  let hit=(list||[]).find(x=>normalizeText(x.nome)===target);
  if(!hit)hit=(list||[]).find(x=>normalizeText(x.nome).includes(target)||target.includes(normalizeText(x.nome)));
  if(!hit)throw new Error('Município não encontrado na base IBGE.');
  return String(hit.codigo_ibge);
}
function classifyConfidence(name,niche){
  const n=normalizeText(name);
  let high,medium;
  if(niche==='Manicure / Nail Designer'){high=/(manicure|pedicure|nail|unha|esmalteria)/;medium=/(beleza|beauty|studio|salao|estetica|espaco)/}
  else if(niche==='Barbearia'){high=/(barbearia|barber|barbershop)/;medium=/(hair|cabelo|cabeleire|salao|studio)/}
  else if(niche==='Cabeleireiro'){high=/(cabeleire|hair|cabelo|coiffeur)/;medium=/(salao|beleza|beauty|studio|espaco)/}
  else {high=/(salao|beleza|beauty|studio|espaco|estetica)/;medium=/(hair|cabelo|nail|manicure|barbearia|barber)/}
  return high.test(n)?'Alta':medium.test(n)?'Média':'A confirmar';
}

function mergeSearchResults(groups){
  const map=new Map();
  for(const group of groups)for(const r of group||[]){
    const phone=digits(r.phone||r.whatsapp),nameKey=normalizeText(r.name)+'|'+normalizeText(r.city),key=r.cnpj?'c:'+r.cnpj:(phone?'p:'+phone:'n:'+nameKey);
    if(!map.has(key)){map.set(key,{...r});continue}
    const a=map.get(key);
    for(const k of ['phone','whatsapp','email','instagram','website','address','cnpj','source_url'])if(!a[k]&&r[k])a[k]=r[k];
    if(r.source&&!String(a.source||'').includes(r.source))a.source=(a.source?a.source+' + ':'')+r.source;
    if(confidenceRank(r.segment_confidence)>confidenceRank(a.segment_confidence))a.segment_confidence=r.segment_confidence;
  }
  const arr=[...map.values()];
  arr.sort((a,b)=>confidenceRank(b.segment_confidence)-confidenceRank(a.segment_confidence)||String(a.name).localeCompare(String(b.name),'pt-BR'));
  return arr;
}

function normText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
async function getCityIbgeCode(city,stateCode){
  const uf=stateCode.trim().toUpperCase();
  const r=await fetchTimeout('https://servicodados.ibge.gov.br/api/v1/localidades/estados/'+encodeURIComponent(uf)+'/municipios',{},10000);
  if(!r.ok)throw new Error('IBGE '+r.status);
  const arr=await r.json(),target=normText(city);
  let hit=arr.find(x=>normText(x.nome)===target);
  if(!hit)hit=arr.find(x=>normText(x.nome).includes(target)||target.includes(normText(x.nome)));
  if(!hit)throw new Error('Município não localizado no IBGE.');
  return String(hit.id);
}


function classifyBusinessName(name,requestedNiche){
  const n=normText(name);
  if(/barbearia|barber|barber shop/.test(n))return {niche:'Barbearia',confidence:'Alta'};
  if(/manicure|nail|unha|esmalteria|pedicure/.test(n))return {niche:'Manicure / Nail Designer',confidence:'Alta'};
  if(/cabeleireir|hair|coiffure/.test(n))return {niche:'Cabeleireiro',confidence:'Alta'};
  if(/salao|beleza|estetica|studio|espaco beauty|espaco de beleza/.test(n))return {niche:'Salão Completo',confidence:'Média'};
  return {niche:requestedNiche,confidence:'CNAE amplo'};
}

    website:'',
    instagram:'',
    address,
    city:x.city||city,
    state:x.state||stateCode,

async function enrichOneContact(r,requestedNiche){
  if(!r||!r.cnpj||r.phone||r._enrichTried)return 'skip';
  try{
    const resp=await fetchTimeout('https://brasilapi.com.br/api/cnpj/v1/'+digits(r.cnpj),{headers:{Accept:'application/json'}},12000);
    if(resp.status===429)return 'rate';
    r._enrichTried=true;
    if(!resp.ok)return 'fail';
    const j=await resp.json();
    const newName=(j.nome_fantasia||j.razao_social||r.name||'').trim();
    if(newName)r.name=newName;
    r.phone=String(j.ddd_telefone_1||j.ddd_telefone_2||'').trim();

    const c=classifyBusinessName(r.name,requestedNiche);
    r.niche=c.niche;r.segment_confidence=c.confidence;
    r.source='Base Empresarial + BrasilAPI';
    return r.phone?'phone':'ok';
  }catch(e){
    r._enrichTried=true;
    return 'fail';
  }
}
let enrichBusy=false;


async function enrichMoreContacts(limit=12,opts={}){
  if(enrichBusy)return {done:0,phones:0,timeout:false};
  const st=$('#searchStatus');if(!st)return {done:0,phones:0,timeout:false};
  const niche=$('#s_niche')?.value||'Salão Completo';
  const candidates=searchResults.filter(r=>r.cnpj&&r.has_phone&&!r.phone&&!r.whatsapp&&!r._enrichTried).slice(0,Math.min(limit,24));
  if(!candidates.length){if(!opts.silent)toast('Não há mais contatos pendentes neste lote.');return {done:0,phones:0,timeout:false}}
  enrichBusy=true;
  const btn=$('#enrichContactsBtn');if(btn){btn.disabled=true;btn.textContent='Buscando telefones...'}
  let done=0,phones=0,timeoutHit=false;
  try{
    for(let i=0;i<candidates.length;i+=12){
      const batch=candidates.slice(i,i+12);
      const cnpjs=batch.map(r=>digits(r.cnpj));
      let res=null;
      try{
        const invoke=sb.functions.invoke('enrich-cnpj',{body:{cnpjs}});
        res=await Promise.race([
          invoke,
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),9500))
        ]);
      }catch(e){
        timeoutHit=true;
        break;
      }
      const items=(res&&res.data&&res.data.results)||[];
      const by=new Map(items.map(x=>[digits(x.cnpj),x]));
      for(const r of batch){
        const x=by.get(digits(r.cnpj));
        r._enrichTried=true;
        done++;
        if(!x||!x.ok)continue;
        if(x.name)r.name=String(x.name).trim()||r.name;
        if(x.phone)r.phone=String(x.phone).trim();
        if(x.email)r.email=String(x.email).trim();
        if(x.address)r.address=String(x.address).trim();
        if(x.city)r.city=String(x.city).trim();
        if(x.state)r.state=String(x.state).trim();
        if(r.phone)phones++;
        const c=classifyBusinessName(r.name,niche);
        r.niche=c.niche;r.segment_confidence=c.confidence;
        r.source='Base Empresarial + BrasilAPI';
      }
      const totalPhones=searchResults.filter(x=>x.phone||x.whatsapp).length;
      if(opts.progress!==false)st.textContent=totalPhones+' telefones públicos confirmados.';
      const box=$('#searchResults');if(box)box.innerHTML=renderSearchResults();
    }
  }finally{
    enrichBusy=false;
    const b=$('#enrichContactsBtn');if(b){b.disabled=false;b.textContent='Buscar mais telefones'}
  }
  return {done,phones,timeout:timeoutHit};
}
async function autoEnrichContacts(targetPhones=12,maxAttempts=36){
  let attempts=0,timeout=false;
  while(searchResults.filter(x=>x.phone||x.whatsapp).length<targetPhones&&attempts<maxAttempts){
    const pending=searchResults.filter(r=>r.cnpj&&r.has_phone&&!r.phone&&!r.whatsapp&&!r._enrichTried).length;
    if(!pending)break;
    const res=await enrichMoreContacts(Math.min(12,pending),{silent:true,progress:true});
    attempts+=res.done;
    if(res.timeout||!res.done){timeout=!!res.timeout;break}
  }
  return {attempts,timeout,phones:searchResults.filter(x=>x.phone||x.whatsapp).length};
}

function mergeSearchResults(a,b,requestedNiche){
  const all=[...(a||[]),...(b||[])],out=[],seen=new Map();
  const keyOf=x=>{
    const p=digits(x.phone||x.whatsapp);
    if(p)return 'p:'+p;
    if(x.cnpj)return 'c:'+digits(x.cnpj);
    return 'n:'+normText(x.name)+'|'+normText(x.address)+'|'+normText(x.city);
  };
  for(const x of all){
    const k=keyOf(x);
    if(!seen.has(k)){seen.set(k,out.length);out.push({...x});continue}
    const i=seen.get(k),cur=out[i];
    out[i]={
      ...cur,...x,
      phone:cur.phone||x.phone||'',
      whatsapp:cur.whatsapp||x.whatsapp||'',
      email:cur.email||x.email||'',
      website:cur.website||x.website||'',
      instagram:cur.instagram||x.instagram||'',
      address:cur.address||x.address||'',
      source:[cur.source,x.source].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' + '),
      has_phone:!!(cur.has_phone||x.has_phone||cur.phone||x.phone),
      segment_confidence:cur.segment_confidence||x.segment_confidence||''
    };
  }
  return out;
}

async function saveLead(){
  const existing=editingId?leads.find(x=>x.id===editingId):null,dnc=$('#f_dnc').checked;
  const row={
    user_id:user.id,name:$('#f_name').value.trim(),owner_name:$('#f_owner').value.trim(),niche:$('#f_niche').value,

function exportCSV(){const heads=['name','owner_name','niche','phone','whatsapp','email','cnpj','city','state','status','instagram','website','address','notes','next_followup_at','do_not_contact','source','source_url','segment_confidence'];const rows=[heads.join(';')].concat(leads.map(l=>heads.map(h=>`"${String(l[h]??'').replaceAll('"','""')}"`).join(';')));const b=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='prospecta-leads.csv';a.click();URL.revokeObjectURL(a.href)}
function parseCSV(text){const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===sep&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
async function importCSV(ev){const file=ev.target.files[0];if(!file)return;const rows=parseCSV(await file.text());if(rows.length<2){toast('CSV vazio.');return}const head=rows[0].map(x=>x.trim().toLowerCase()),batch=[];for(const r of rows.slice(1)){const o={};head.forEach((h,i)=>o[h]=r[i]||'');if(!o.name)continue;const p=digits(o.phone||o.whatsapp);if(leads.some(l=>p&&digits(l.phone||l.whatsapp)===p))continue;batch.push({user_id:user.id,name:o.name,owner_name:o.owner_name||o.owner||'',niche:NICHES.includes(o.niche)?o.niche:'Salão Completo',phone:o.phone||'',whatsapp:o.whatsapp||'',email:o.email||'',cnpj:o.cnpj||'',city:o.city||'',state:(o.state||'').toUpperCase(),status:STATUSES.includes(o.status)?o.status:'Novo',instagram:o.instagram||'',website:o.website||'',address:o.address||'',notes:o.notes||'',next_followup_at:o.next_followup_at||o.followup||null,do_not_contact:String(o.do_not_contact||o.dnc).toLowerCase()==='true',source:o.source||'CSV',source_url:o.source_url||'',segment_confidence:o.segment_confidence||''})}if(!batch.length){toast('Nenhum lead novo para importar.');return}const {data,error}=await sb.from('leads').insert(batch).select();if(error){toast(error.message);return}leads=[...(data||[]),...leads];render();toast(`${data.length} leads importados.`);ev.target.value=''}
