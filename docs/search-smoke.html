<!doctype html><meta charset="utf-8"><title>Smoke Search</title>
<style>body{font-family:Arial;padding:30px}button{padding:12px 18px}#s{margin:15px 0}pre{white-space:pre-wrap}</style>
<input id="city" value="São José do Rio Preto"><input id="uf" value="SP"><button id="btn">Buscar empresas</button>
<div id="s"></div><pre id="o"></pre>
<script>
const $=s=>document.querySelector(s);
function digits(v){return String(v||'').replace(/\D/g,'')}
async function fetchTimeout(url,opts={},ms=15000){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);try{return await fetch(url,{...opts,signal:ctl.signal})}finally{clearTimeout(tm)}}
async function browserGeocode(city,stateCode){const u=new URL('https://nominatim.openstreetmap.org/search');u.searchParams.set('format','json');u.searchParams.set('limit','1');u.searchParams.set('countrycodes','br');u.searchParams.set('q',city+', '+stateCode+', Brasil');const r=await fetchTimeout(u.toString(),{headers:{'Accept-Language':'pt-BR','Accept':'application/json'}},10000);if(!r.ok)throw new Error('geo '+r.status);const a=await r.json();if(!a[0])throw new Error('cidade');return {lat:Number(a[0].lat),lon:Number(a[0].lon)}}
async function browserOverpass(q){const ep='https://overpass-api.de/api/interpreter';const r=await fetchTimeout(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','Accept':'application/json'},body:'data='+encodeURIComponent(q)},20000);if(!r.ok)throw new Error('overpass '+r.status);return (await r.json()).elements||[]}
async function go(){const st=$('#s');st.textContent='Buscando negócios públicos...';$('#o').textContent='';try{const g=await browserGeocode($('#city').value,$('#uf').value);st.textContent='Cidade localizada. Consultando empresas...';const q='[out:json][timeout:15];nwr["shop"="beauty"](around:10000,'+g.lat+','+g.lon+');out center tags 120;';const els=await browserOverpass(q);const arr=els.filter(x=>{const t=x.tags||{},n=String(t.name||'').toLowerCase(),b=String(t.beauty||'').toLowerCase();return /(nail|unha|manicure|esmalteria)/.test(n)||/(nails|manicure|pedicure)/.test(b)}).filter(x=>(x.tags||{}).name);st.textContent=arr.length+' encontrados';$('#o').textContent=arr.map(x=>(x.tags||{}).name).join('\n')}catch(e){st.textContent='ERRO: '+e}}
document.getElementById('btn').addEventListener('click',go);
</script>
