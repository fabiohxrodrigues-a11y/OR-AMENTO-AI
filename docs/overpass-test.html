<!doctype html><meta charset="utf-8"><title>Teste Overpass</title>
<body style="font-family:Arial;padding:24px"><h2>Teste de busca</h2><pre id="o">iniciando...</pre>
<script>
const o=document.getElementById('o');
const q='[out:json][timeout:12];nwr["shop"="beauty"](around:10000,-20.8113,-49.3758);out center tags 50;';
const eps=[
'https://overpass.private.coffee/api/interpreter',
'https://overpass-api.de/api/interpreter',
'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];
(async()=>{
 let logs=[];
 for(const ep of eps){
  try{
   logs.push('tentando '+ep);o.textContent=logs.join('\n');
   const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);
   const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q),signal:c.signal});
   clearTimeout(t);
   logs.push('status '+r.status);
   if(r.ok){const d=await r.json();logs.push('OK elementos='+((d.elements||[]).length));o.textContent=logs.join('\n');return;}
  }catch(e){logs.push('erro '+e);}
 }
 o.textContent=logs.join('\n');
})();
</script>
